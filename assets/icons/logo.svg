<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 9 94 88" width="101" height="94" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <defs>
        <!-- O : blanc délavé -->
        <linearGradient id="og-o" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f4f1ea" />
            <stop offset="0.5" stop-color="#d6d1c4" />
            <stop offset="1" stop-color="#a9a497" />
        </linearGradient>
        <!-- G : or métallique -->
        <linearGradient id="og-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f8e0a4" />
            <stop offset="0.5" stop-color="#e6b24b" />
            <stop offset="1" stop-color="#a8762a" />
        </linearGradient>
        <!-- Coupe le O autour du G pour l'effet entrecroisé (fond transparent) -->
        <mask id="og-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
            <rect x="0" y="0" width="100" height="100" fill="#fff" />
            <path d="M82.4 42.6 A24 24 0 1 0 88 58 L70 58" fill="none" stroke="#000" stroke-width="20" />
        </mask>
    </defs>
    <circle cx="38" cy="48" r="24" fill="none" stroke="url(#og-o)" stroke-width="12" mask="url(#og-cut)" />
    <path d="M82.4 42.6 A24 24 0 1 0 88 58 L70 58" fill="none" stroke="url(#og-g)" stroke-width="12" />
</svg>
